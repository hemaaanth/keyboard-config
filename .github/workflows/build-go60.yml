name: Build Go60 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/go60.keymap"
      - "config/go60.conf"
      - "config/default.nix"
      - ".github/workflows/build-go60.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          # Must match the environment the local build script uses
          # (scripts/build-go60-local.sh runs a nixos-23.11 container);
          # 22.05's nanopb module ships a protoc whose loader is missing,
          # failing with "protoc: not found".
          nix_path: nixpkgs=channel:nixos-23.11
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      # Same nix patches scripts/build-go60-local.sh applies: MoErgo's zmk.nix
      # is missing protobuf/setuptools, so the nanopb generator can't find
      # protoc and the build dies at "protoc: not found".
      - name: Patch MoErgo nix build (protoc/setuptools)
        run: |
          sed -i "/    pykwalify/a\    setuptools" src/nix/zmk.nix
          sed -i "/    setuptools/a\    ps.protobuf" src/nix/zmk.nix
          sed -i "s/, cmake, ninja, dtc, gcc-arm-embedded/, cmake, ninja, dtc, gcc-arm-embedded, protobuf/" src/nix/zmk.nix
          sed -i "s/nativeBuildInputs = \[ cmake ninja python dtc gcc-arm-embedded \]/nativeBuildInputs = [ cmake ninja python dtc gcc-arm-embedded protobuf ]/" src/nix/zmk.nix
      - name: Build Go60 combined firmware
        run: nix-build config -o combined
      - name: Copy result out of nix store
        run: cp combined/go60.uf2 go60.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2
