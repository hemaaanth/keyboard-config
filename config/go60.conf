# Starting Go60 port of the Eyelash Corne layout.
# Keep this minimal until the baseline layout feels right.

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Paseo LEDs spike (config/paseo-leds): pulls in the WS2812 driver (SPI +
# WS2812_STRIP forced on by boards/arm/go60/Kconfig.defconfig once this is
# on) so paseo_leds.c can DEVICE_DT_GET the strip and write to it directly.
# ON_START=n keeps ZMK's own underglow timer from ever running, so it never
# repaints over the per-key pixels the spike writes.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Paseo LEDs spike: each BLE frame can push up to 3 behavior invocations to
# the peripheral (5 right-half pixels, 2 per call); the default queue of 5
# is too tight if a key-position event is in flight at the same moment.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=10
