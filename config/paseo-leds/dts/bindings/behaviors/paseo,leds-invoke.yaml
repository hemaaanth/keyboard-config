# Paseo LEDs -- Phase 2 firmware spike (per-key RGB over BLE, number row)
# SPDX-License-Identifier: MIT

description: |
  Global-locality behavior used internally by the paseo-leds GATT write
  handler (central/left half) to push right-half pixel updates to the
  peripheral over the split link. Not meant to be bound in a keymap layer.
  param1/param2 each pack one pixel as index<<24 | r<<16 | g<<8 | b; param2
  may be the sentinel 0xFFFFFFFF meaning "no second pixel this call". The
  index byte may also be 0xFD, the host microphone-state sentinel, or 0xFE,
  the fill-all sentinel. The peripheral applies either control operation
  without consulting the logical key maps (see paseo_leds.c).

compatible: "paseo,leds-invoke"

include: two_param.yaml
